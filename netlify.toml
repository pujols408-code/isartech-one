[build]
  # CRM360 is temporarily bypassed because its original compressed overlay is
  # not a valid tar archive. The currently published v0.8 base does not depend
  # on it, and Project 360 is an isolated overlay that can deploy safely on top.
  command = "bash scripts/unpack-release.sh && bash scripts/apply-v08-overlay.sh && bash scripts/apply-v09-project360.sh && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
