[build]
  # CRM360 and the old v0.9 Project 360 overlay are both permanently retired:
  # their compressed archives were corrupted at the source and unrecoverable.
  # Project 360 (proyectos/[id], hitos, vínculo de OT) now ships as normal
  # tracked source files instead of a base64 overlay, so no extra unpack step
  # is needed for it.
  command = "bash scripts/unpack-release.sh && bash scripts/apply-v08-overlay.sh && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
